<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rishi Music</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#060d1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient glossy background glow lights -->
  <div class="app-background-glow glow-1"></div>
  <div class="app-background-glow glow-2"></div>

  <div class="app-container">
    <!-- Sidebar / Top controls -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge">PRO</div>
        <h1>♫ RISHI MUSIC</h1>
        <p>Personal Audio Station</p>
      </div>

      <label class="btn-import">
        <span class="icon">＋</span> Import Track
        <input type="file" id="audioFileInput" accept="audio/*" multiple />
      </label>

      <!-- Music Director Filter -->
      <div class="filter-group">
        <label for="directorFilter">PLAYLIST / MUSIC DIRECTOR</label>
        <div class="custom-select-wrapper">
          <select id="directorFilter">
            <option value="all">ALL DIRECTORS</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- Main List View -->
    <main class="main-content">
      <header class="top-nav">
        <div class="view-header-group">
          <h2 id="viewTitle">All Songs</h2>
          <span class="heading-tag" id="trackCountBadge">0 songs</span>
        </div>
        <div class="search-wrapper">
          <input type="text" id="searchInput" placeholder="🔍 Search song or director..." />
        </div>
      </header>

      <!-- Song List Section (Plays & Edit buttons render here via app.js) -->
      <section class="song-list" id="songListContainer"></section>
    </main>

    <!-- Persistent Bottom Audio Player (No Photo Artwork) -->
    <footer class="player-bar">
      <!-- Song Metadata -->
      <div class="meta-box">
        <div class="meta-text">
          <div class="track-title" id="playerTitle">No track playing</div>
          <div class="track-artist" id="playerArtist">SELECT A SONG FROM YOUR LIBRARY</div>
        </div>
      </div>

      <!-- Center Playback Controls -->
      <div class="controls-box">
        <button id="prevBtn" class="control-btn" aria-label="Previous">⏮</button>
        <button id="playBtn" class="control-btn primary" aria-label="Play">▶</button>
        <button id="nextBtn" class="control-btn" aria-label="Next">⏭</button>
      </div>

      <!-- Scrubber Timeline -->
      <div class="slider-box">
        <span id="currentTime">0:00</span>
        <div class="range-container">
          <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" />
        </div>
        <span id="totalTime">0:00</span>
      </div>
    </footer>
  </div>

  <!-- Audio Element Engine -->
  <audio id="audioEngine" preload="auto" playsinline></audio>
  <script src="./app.js"></script>
</body>
</html>
